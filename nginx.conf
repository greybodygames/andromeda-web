server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html/site;
    absolute_redirect off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
