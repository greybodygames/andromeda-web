name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.idea/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/ci.yaml

  detect-delivery-changes:
    name: Detect Delivery Changes
    permissions:
      contents: read
    uses: $/.github/workflows/detect-delivery-changes.yaml

  deliver-website:
    name: Deliver Website
    if: needs.detect-delivery-changes.outputs.website-changed == 'true'
    needs:
      - detect-delivery-changes
      - ci
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/deliver-website.yaml
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
