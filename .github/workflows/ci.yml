name: CI

on:
  workflow_call:
    inputs:
      publish-artifact:
        description: Upload the validated static site for a downstream deployment
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout and install dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          node-version-file: .nvmrc

      - name: Check formatting
        run: npm run format:check

      - name: Build site
        run: npm run build

      - name: Validate generated site
        uses: SayakMukhopadhyay/github-actions/validate-static-site@v1
        with:
          path: dist

      - name: Upload static site
        if: inputs.publish-artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-andromeda-web
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  codeql:
    name: Analyze Go with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout and install dependencies
        uses: SayakMukhopadhyay/github-actions/checkout-dependencies@v1
        with:
          node-version-file: .nvmrc

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@v4
