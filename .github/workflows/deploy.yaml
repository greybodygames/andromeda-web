name: Deploy

on:
  workflow_call:
    inputs:
      deployment-environment:
        description: GitHub Environment selected by the pipeline
        required: true
        type: string
      chart-name:
        description: Static-site wrapper chart being deployed
        required: true
        type: string
      image-tag:
        description: Published static-site image tag
        required: true
        type: string
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: GitHub App private key used to update the GitOps repository
        required: true

permissions: {}

jobs:
  deploy:
    name: Update GitOps deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.deployment-environment }}
      url: ${{ vars.URL }}
    permissions: {}

    steps:
      - id: gitops-token
        name: Create GitOps installation token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: SayakMukhopadhyay
          repositories: k8s-landscape-charts
          permission-contents: write

      - name: Update GitOps deployment state
        uses: SayakMukhopadhyay/github-actions/static-site-update-deploy@v1
        with:
          token: ${{ steps.gitops-token.outputs.token }}
          environment: ${{ vars.GITOPS_ENVIRONMENT }}
          chart-name: ${{ inputs.chart-name }}
          image-version: ${{ inputs.image-tag }}
