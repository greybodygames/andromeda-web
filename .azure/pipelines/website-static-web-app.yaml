trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    submodules: true

  - task: UseNode@1
    displayName: Use Node 24.16.0
    inputs:
      version: "24.16.0"

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build site

  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      app_location: "dist"
      api_location: ""
      output_location: ""
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(deployment_token)
